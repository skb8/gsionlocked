name: App and source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"
      - run: python tools/audit_public.py
      - run: python tools/test.py
      - run: python tools/test_pd2425.py
      - run: python tools/test_live_probe.py
      - run: python tools/test_profile_review.py
      - run: python tools/test_cgroup_probe.py
      - run: python tools/test_namespace_probe.py
      - run: python tools/test_bootstrap_probe.py
      - run: python tools/build_app.py --debug --ndk "$ANDROID_HOME/ndk/25.2.9519653"
      - run: python tools/build_runtime.py --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-components
          path: dist/runtime/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-build-logs
          path: build/runtime/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: gsionlocked-pd2425-diagnostics
          path: dist/gsionlocked.apk
      - run: python tools/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: gsionlocked-source
          path: dist/gsionlocked-source.zip
